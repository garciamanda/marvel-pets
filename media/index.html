<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline'; img-src {{cspSource}} data:;">
  <title>Marvel Pets</title>
  <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
  <div id="game-container">
    <div class="moon"></div>
    <div class="skyline">
      <div class="building b1"><span class="antenna"></span></div>
      <div class="building b2"><span class="tank"></span></div>
      <div class="building b3"></div>
      <div class="building b4"><span class="antenna"></span></div>
      <div class="building b5"><span class="tank"></span></div>
      <div class="building b6"></div>
    </div>
    <div class="roof"></div>
    <div class="web web-left"></div>
    <div class="web web-right"></div>
    <div id="pet"></div>
    <div id="speech-bubble" class="is-hidden"></div>
  </div>
  <script>
    window.SPRITE_URIS = {{spritesJson}};
    window.IDLE_URI = '{{idleUri}}';
    window.WALK_URI = '{{walkSheetUri}}';
  </script>
  <script src="{{scriptUri}}"></script>
</body>
</html>
